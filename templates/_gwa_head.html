<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d2c54;--teal:#0a7f8c;--cyan:#2fd8e0;--bg:#eef5fb;--card:#fff;--line:#d9e6ef;--text:#14365c;--muted:#5d7690;--soft:#f5fafd;--danger:#c0392b;--ok:#1f8a4c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,#0d2c54 0%,#0b4d6e 55%,#0a7f8c 100%);color:#fff;text-align:center;padding:14px 16px 26px}
.hero::before{content:"";position:absolute;left:-90px;top:-90px;width:300px;height:300px;border-radius:50%;border:40px solid rgba(255,255,255,.04)}
.hero::after{content:"";position:absolute;right:0;top:0;width:260px;height:100%;opacity:.35;background-image:radial-gradient(circle,#2fd8e0 2px,transparent 3px),repeating-linear-gradient(135deg,transparent 0 38px,rgba(47,216,224,.5) 38px 39px);background-size:46px 46px,auto}
.badge{display:inline-block;background:linear-gradient(90deg,#1192b8,#18a9b5);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em}
.hero-row{display:flex;align-items:center;justify-content:center;gap:clamp(16px,6vw,70px);margin-top:10px;position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(24px,4.6vw,46px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--cyan)}
.hero p{margin:6px 0 0;opacity:.85}
.logo{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.logo.red{background:#8b1d10;border:4px solid #fff}
.wrap{max-width:1156px;margin:0 auto;padding:0 16px}
.nav{margin-top:14px;background:linear-gradient(100deg,#0d2c54,#0b5a6e);border-radius:14px;padding:16px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 24px rgba(13,44,84,.25)}
.nav button{background:rgba(255,255,255,.06);color:#e3f0f7;border:1px solid transparent;padding:10px 16px;border-radius:9px;font:inherit;font-size:15px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button.active{background:rgba(47,216,224,.15);border-color:#3fb8c4}
.nav .logout{margin-left:auto;background:#eef4f9;color:var(--navy);font-weight:700;padding:12px 22px}
.nav .logout:hover{background:#fff}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:30px 6px 30px;flex-wrap:wrap}
.pill{display:inline-block;background:linear-gradient(90deg,#1192b8,#18a9b5);color:var(--navy);font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 14px;border-radius:999px}
.pagehead h2{margin:12px 0 0;font-size:28px;font-weight:800}
.online{border:1px solid #9fe0bd;background:#eafaf1;color:var(--ok);font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 36px;box-shadow:0 10px 30px rgba(13,44,84,.06);margin-bottom:24px}
.card h3{margin:0 0 12px;font-size:19px}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;color:var(--text);background:#fff;margin-bottom:22px}
input:focus,select:focus{outline:2px solid #8fdde3;border-color:#3fb8c4}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:linear-gradient(90deg,#0a7f8c,#14b8c4);color:#fff;box-shadow:0 4px 10px rgba(10,127,140,.25)}
.btn.ghost{background:#eef3f8;color:var(--text);box-shadow:none}
.btn.danger{background:#fdecea;color:var(--danger);box-shadow:none}
.btn:hover{filter:brightness(1.05)}
.btn.sm{padding:8px 12px;font-size:13px}
</style>
