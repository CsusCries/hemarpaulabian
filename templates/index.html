<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student API Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
        }
    </style>
</head>
<body>
    <h1>Student API Interface</h1>

    <button onclick="loadStudent()">Load Student Information</button>
    <div id="result"></div>

    <hr>
    <h2>Greeting API</h2>

    <input type="text" id="nameInput" placeholder="Enter your first name">
    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting"></p>

    <hr>
    <h2>Favorite Food API</h2>

    <input type="text" id="cuisineInput" placeholder="Enter a cuisine (e.g. Japanese)">
    <button onclick="loadFavoriteFood()">Get Favorite Food</button>

    <div id="food-result"></div>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText = data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }

        function loadFavoriteFood() {
            const cuisine = document.getElementById('cuisineInput').value;

            fetch('/favorite_food?cuisine=' + encodeURIComponent(cuisine))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('food-result').innerHTML =
                        '<p><b>Preferred Cuisine:</b> ' + data.preferred_cuisine + '</p>' +
                        '<p><b>Favorite Dish:</b> ' + data.favorite_dish + '</p>' +
                        '<p><b>Restaurant:</b> ' + data.restaurant + '</p>' +
                        '<p><b>Rating:</b> ' + data.rating + '/5</p>';
                })
                .catch(error => {
                    document.getElementById('food-result').innerHTML =
                        '<p>Unable to retrieve favorite food.</p>';
                });
        }
    </script>
</body>
</html>
